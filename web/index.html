<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Music 网页版</title>
<style>
:root{--bg:#0d1117;--panel:rgba(255,255,255,.04);--text:#e6edf3;--text2:#8b949e;--accent:#6c5ce7;--border:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
.sidebar{width:210px;background:rgba(10,12,18,.92);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.brand{font-size:16px;font-weight:700;padding:6px 12px 14px}.brand span{color:var(--accent)}
.nav-btn{padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px;transition:all .15s;border:none;background:none;text-align:left}
.nav-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
.nav-btn.active{background:rgba(108,92,231,.15);color:#fff}
.spacer{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.topbar h1{font-size:15px;flex:1}
.import-btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.search{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 12px;width:200px;color:var(--text);outline:none;font-size:12.5px}
.search::placeholder{color:var(--text2)}
.content{flex:1;overflow-y:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:all .15s}
.card:hover{border-color:rgba(108,92,231,.5);transform:translateY(-2px)}
.card .cov{width:100%;aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:8px}
.card .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sb{font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}
.row:hover{background:rgba(255,255,255,.05)}
.row.playing{background:rgba(108,92,231,.12)}
.row .ix{width:20px;color:var(--text2);font-size:11px}
.row .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ar{width:150px;color:var(--text2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .du{width:44px;color:var(--text2);font-size:11px;text-align:right}
.player{border-top:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:12px;background:rgba(10,12,18,.92)}
.now{width:170px}.now .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now .a{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:15px;flex-shrink:0}
.pbtn-sm{width:30px;height:30px;border-radius:50%;background:transparent;color:var(--text2);border:none;cursor:pointer;font-size:13px;flex-shrink:0}
.pbtn-sm:hover{color:#fff}
.prog{flex:1;display:flex;align-items:center;gap:8px}
.trk{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:999px;cursor:pointer;position:relative}
.fil{height:100%;background:var(--accent);border-radius:999px;width:0}
.tm{font-size:10.5px;color:var(--text2)}
.fs{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
.fs.show{display:flex}
.fs-back{position:absolute;top:14px;left:14px;z-index:5}
.fs-body{flex:1;display:flex;overflow:hidden}
.fs-left{width:38%;display:flex;align-items:center;justify-content:center}
.fs-cover{width:min(300px,70%);aspect-ratio:1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:80px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.fs-right{flex:1;display:flex;flex-direction:column;padding:26px;overflow-y:auto}
.fs-ti{font-size:22px;font-weight:700;margin-bottom:4px}
.fs-ar{color:var(--text2);margin-bottom:18px}
.lrc{padding:5px 0;color:var(--text2);opacity:.7;font-size:13.5px;transition:all .3s}
.lrc.on{color:#fff;opacity:1;font-size:15.5px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200}
.modal.show{display:flex}
.mcard{background:#161b22;border:1px solid var(--border);border-radius:14px;padding:18px;width:min(400px,90vw)}
.mcard h2{font-size:15px;margin-bottom:10px}
.mcard input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);margin-bottom:8px;outline:none}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:12.5px}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text2)}
.chat{height:240px;overflow-y:auto;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:10px;font-size:12.5px;line-height:1.5}
.msg.ai{background:rgba(255,255,255,.07);align-self:flex-start}
.msg.user{background:rgba(108,92,231,.3);align-self:flex-end}
.cin{display:flex;gap:8px}.cin input{flex:1;margin:0}
.empty{text-align:center;color:var(--text2);padding:50px 20px}.empty .ic{font-size:44px;margin-bottom:14px}.empty p{font-size:13.5px;line-height:1.8}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#22272e;color:#fff;padding:9px 18px;border-radius:8px;font-size:12.5px;z-index:300;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.lbl{font-size:11.5px;color:var(--text2);display:block;margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
<aside class="sidebar">
<div class="brand">Echo <span>Music</span> 网页版</div>
<button class="nav-btn active" data-v="songs">🎵 所有歌曲</button>
<button class="nav-btn" data-v="albums">💿 专辑</button>
<button class="nav-btn" data-v="artists">🎤 歌手</button>
<div class="spacer"></div>
<button class="nav-btn" data-v="aipick">🤖 AI 挑歌</button>
<button class="nav-btn" data-v="settings">⚙️ 设置</button>
</aside>
<div class="main">
<div class="topbar"><h1 id="pt">所有歌曲</h1><input class="search" id="search" placeholder="搜索歌曲、专辑、歌手…"><button class="import-btn" id="imp">📁 导入音乐</button></div>
<div class="content" id="content"></div>
<div class="player">
<div class="now" id="now"><div class="t">未在播放</div><div class="a">导入音乐开始聆听</div></div>
<button class="pbtn-sm" id="prev">⏮</button>
<button class="pbtn" id="play">▶</button>
<button class="pbtn-sm" id="next">⏭</button>
<div class="prog"><span class="tm" id="tc">0:00</span><div class="trk" id="trk"><div class="fil" id="fil"></div></div><span class="tm" id="tt">0:00</span></div>
<button class="pbtn-sm" id="fs-open" title="歌词页">📄</button>
</div>
</div>
</div>
<div class="fs" id="fs"><button class="pbtn-sm fs-back" id="fs-close">← 返回</button><div class="fs-body"><div class="fs-left"><div class="fs-cover" id="fs-cov">♪</div></div><div class="fs-right"><div class="fs-ti" id="fs-ti">—</div><div class="fs-ar" id="fs-ar">—</div><div id="fs-lyr"><div class="empty"><p>暂无歌词</p></div></div></div></div></div>
<div class="modal" id="setm"><div class="mcard"><h2>⚙️ 设置</h2><label class="lbl">DeepSeek API Key（歌词翻译 / AI 挑歌）</label><input type="password" id="key" placeholder="sk-..." autocomplete="off"><div class="macts"><button class="btn ghost" id="setc">取消</button><button class="btn" id="sets">保存</button></div></div></div>
<div class="modal" id="aipm"><div class="mcard"><h2>🤖 AI 挑歌</h2><p class="lbl" style="margin-bottom:8px">告诉 AI 你想要的感觉，它从你的曲库挑歌。</p><div class="chat" id="aipc"><div class="msg ai">你好！告诉我你想听什么感觉，比如「适合深夜的安静英文歌」。</div></div><div class="cin"><input id="aipi" placeholder="描述想要的感觉…"><button class="btn" id="aips">发送</button></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="finput" webkitdirectory directory multiple style="display:none">
<script>
const $=id=>document.getElementById(id);
const st={songs:[],filtered:[],cur:-1,view:"songs",key:localStorage.getItem("echoWebKey")||"",playing:false};
function fmt(s){if(!isFinite(s))return"0:00";const m=Math.floor(s/60),x=Math.floor(s%60);return m+":"+String(x).padStart(2,"0")}
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function guessAlbum(p){const a=(p||"").split("/");return a.length>1?a[0]:"未知专辑"}
function guessArtist(n){const m=String(n).match(/^(.+?)\s*-\s*/);return m?m[1]:"未知歌手"}
function probe(u){return new Promise(r=>{const a=new Audio();a.src=u;a.onloadedmetadata=()=>r(a.duration||0);a.onerror=()=>r(0);setTimeout(()=>r(0),4000)})}
async function importFiles(list){
const ex=/\.(mp3|flac|alac|m4a|aac|wav|ogg|oga|opus|ape|wma|aiff|aif)$/i;
const fs=[...list].filter(f=>ex.test(f.name));
if(!fs.length){toast("没有音频文件");return}
const arr=[];
for(const f of fs){try{const url=URL.createObjectURL(f);const d=await probe(url);arr.push({id:f.webkitRelativePath||f.name,name:f.name.replace(/\.[^.]+$/,""),url,duration:d,album:guessAlbum(f.webkitRelativePath||f.name),artist:guessArtist(f.name)})}catch(e){}}
st.songs=arr;st.filtered=arr;render();toast("已导入 "+arr.length+" 首");
}
const audio=new Audio();
function playIdx(i){if(i<0||i>=st.filtered.length)return;st.cur=i;const s=st.filtered[i];audio.src=s.url;audio.play();st.playing=true;upUI();document.getElementById("now").innerHTML='<div class="t">'+esc(s.name)+'</div><div class="a">'+esc(s.artist)+'</div>';render()}
function tog(){if(st.cur<0&&st.songs.length){playIdx(0);return}audio.paused?audio.play():audio.pause()}
function nx(){if(!st.filtered.length)return;playIdx((st.cur+1)%st.filtered.length)}
function pv(){if(!st.filtered.length)return;playIdx((st.cur-1+st.filtered.length)%st.filtered.length)}
const GR=[["#6c5ce7","#a29bfe"],["#e17055","#fdcb6e"],["#00cec9","#55efc4"],["#0984e3","#74b9ff"],["#d63031","#fab1a0"],["#e84393","#fd79a8"]];
function grad(n){let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))%997;const g=GR[h%GR.length];return"linear-gradient(135deg,"+g[0]+","+g[1]+")"}
function upUI(){document.getElementById("play").textContent=audio.paused?"▶":"⏸";const s=st.cur>=0?st.filtered[st.cur]:null;document.getElementById("fs-ti").textContent=s?s.name:"—";document.getElementById("fs-ar").textContent=s?s.artist:"—";document.getElementById("fs-cov").style.background=s?grad(s.name):GR[0].join();loadLrc(s)}
audio.addEventListener("timeupdate",()=>{if(audio.duration){document.getElementById("fil").style.width=(audio.currentTime/audio.duration*100)+"%";document.getElementById("tc").textContent=fmt(audio.currentTime);document.getElementById("tt").textContent=fmt(audio.duration)}upLrc()});
audio.addEventListener("ended",nx);
audio.addEventListener("play",()=>{st.playing=true;upUI()});
audio.addEventListener("pause",()=>{st.playing=false;upUI()});
function render(){const T={songs:"所有歌曲",albums:"专辑",artists:"歌手",aipick:"AI 挑歌",settings:"设置"};document.getElementById("pt").textContent=T[st.view]||"";if(st.view==="songs")rs();else if(st.view==="albums")ra();else if(st.view==="artists")rp();else if(st.view==="aipick"){document.getElementById("aipm").classList.add("show")}else if(st.view==="settings"){document.getElementById("setm").classList.add("show");document.getElementById("key").value=st.key}}
function rs(){const c=document.getElementById("content");if(!st.filtered.length){c.innerHTML='<div class="empty"><div class="ic">🎵</div><p>点击右上角「导入音乐」选择你的音乐文件夹<br>支持 MP3 / FLAC / M4A / WAV / OGG 等</p></div>';return}
c.innerHTML=st.filtered.map((s,i)=>'<div class="row'+(i===st.cur?" playing":"")+'" data-i="'+i+'"><span class="ix">'+(i+1)+'</span><span class="ti">'+esc(s.name)+'</span><span class="ar">'+esc(s.artist)+'</span><span class="du">'+fmt(s.duration)+'</span></div>').join("")}
function ra(){const b={};st.songs.forEach(s=>{const a=s.album||"未知专辑";(b[a]=b[a]||[]).push(s)});const c=document.getElementById("content");if(!st.songs.length){c.innerHTML='<div class="empty"><div class="ic">💿</div><p>导入音乐后显示专辑</p></div>';return}
c.innerHTML='<div class="grid">'+Object.keys(b).map((a,i)=>'<div class="card" data-a="'+esc(a)+'"><div class="cov" style="background:'+grad(a)+'">💿</div><div class="nm">'+esc(a)+'</div><div class="sb">'+b[a].length+' 首</div></div>').join("")+'</div>'}
function rp(){const b={};st.songs.forEach(s=>{const a=s.artist||"未知歌手";(b[a]=b[a]||[]).push(s)});const c=document.getElementById("content");if(!st.songs.length){c.innerHTML='<div class="empty"><div class="ic">🎤</div><p>导入音乐后显示歌手</p></div>';return}
c.innerHTML='<div class="grid">'+Object.keys(b).map(a=>'<div class="card" data-p="'+esc(a)+'"><div class="cov" style="background:'+grad(a)+'">🎤</div><div class="nm">'+esc(a)+'</div><div class="sb">'+b[a].length+' 首</div></div>').join("")+'</div>'}
let lrcS={lines:[],cur:-1};
function parseLrc(t){const L=[];const re=/\[([0-9]+):([0-9]+(?:\.[0-9]+)?)\](.*)/g;let m;while((m=re.exec(t)))L.push({time:Number(m[1])*60+Number(m[2]),text:m[3].trim()});if(!L.length)return t.split(String.fromCharCode(10)).map(l=>({time:-1,text:l.trim()})).filter(l=>l.text);return L}
async function loadLrc(s){lrcS={lines:[],cur:-1};const el=document.getElementById("fs-lyr");if(!s){el.innerHTML='<div class="empty"><p>暂无歌词</p></div>';return}
el.innerHTML='<div class="empty"><p>正在获取歌词…</p></div>';
try{const l=await fetchLrc(s);if(l){lrcS.lines=parseLrc(l);el.innerHTML=lrcS.lines.length?lrcS.lines.map((x,i)=>'<div class="lrc" data-i="'+i+'">'+esc(x.text)+'</div>').join(""):'<div class="empty"><p>暂无歌词</p></div>';if(st.key&&lrcS.lines.length)trans()}else el.innerHTML='<div class="empty"><p>未找到歌词（配置 API Key 可让 AI 生成）</p></div>'}catch(e){el.innerHTML='<div class="empty"><p>歌词获取失败</p></div>'}}
async function fetchLrc(s){try{const q=s.name+" "+(s.artist||"");const r=await fetch("https://lrclib.net/api/search?q="+encodeURIComponent(q));if(r.ok){const d=await r.json();if(d&&d.length&&d[0].syncedLyrics)return d[0].syncedLyrics;if(d&&d.length&&d[0].plainLyrics)return d[0].plainLyrics}}catch(e){}
if(st.key){try{const o=await ds([{role:"system",content:"你是歌词专家。输出歌曲《"+s.name+"》完整歌词，LRC 格式 [mm:ss.xx] 每行一句。无法确认则只回复无法获取歌词。"},{role:"user",content:"歌曲："+s.name+" - "+(s.artist||"")}],3000);if(o&&o!=="无法获取歌词")return o}catch(e){}}
return null}
async function trans(){const txt=lrcS.lines.map(l=>l.text).join(String.fromCharCode(10));try{const o=await ds([{role:"system",content:"把歌词逐行翻译成简体中文，按行对应，只输出翻译。"},{role:"user",content:txt}],2000);if(o){const ls=o.split(String.fromCharCode(10)).filter(l=>l.trim());ls.forEach((t,i)=>{if(lrcS.lines[i]){const el=document.querySelector('.lrc[data-i="'+i+'"]');if(el)el.innerHTML=esc(lrcS.lines[i].text)+'<div style="font-size:11px;color:var(--text2);margin-top:2px">'+esc(t)+'</div>'}})}}catch(e){}}
function upLrc(){if(!lrcS.lines.length)return;const t=audio.currentTime||0;let idx=-1;for(let i=0;i<lrcS.lines.length;i++){if(lrcS.lines[i].time<=t)idx=i;else break}
if(idx!==lrcS.cur){lrcS.cur=idx;document.querySelectorAll("#fs-lyr .lrc").forEach(e=>e.classList.remove("on"));if(idx>=0){const el=document.querySelector('.lrc[data-i="'+idx+'"]');if(el){el.classList.add("on");el.scrollIntoView({block:"center",behavior:"smooth"})}}}}
async function ds(ms,mt){if(!st.key)return null;const r=await fetch("https://api.deepseek.com/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+st.key},body:JSON.stringify({model:"deepseek-chat",messages:ms,max_tokens:mt||2000})});if(!r.ok)throw new Error("API "+r.status);const d=await r.json();return d.choices&&d.choices[0]&&d.choices[0].message?d.choices[0].message.content:null}
async function aiPick(txt){const q=String(txt||"").trim();if(!q)return;if(!st.key){addMsg("ai","请先在设置填 API Key");return}addMsg("user",q);addMsg("ai","正在挑歌…");
try{const lib=st.songs.slice(0,200).map(s=>"《"+s.name+"》-"+(s.artist||"?")).join(String.fromCharCode(10));const o=await ds([{role:"system",content:"你是 AI 选歌师。用户描述听歌感觉，你从他提供的本地曲库选歌组歌单。只从曲库选，不编造。输出 JSON：{text:简短说明,picks:[{title:歌名,why:理由}]}"},{role:"user",content:"要求："+q+" 曲库："+lib}],2000);
if(!o){addMsg("ai","没挑到，换个说法");return}const m=o.match(/\{[\s\S]*\}/);if(!m){addMsg("ai",o.slice(0,300));return}const d=JSON.parse(m[0]);let h=d.text||"给你挑好了：";(d.picks||[]).forEach(p=>{const s=st.songs.find(x=>(x.name||"").toLowerCase()===String(p.title||"").toLowerCase());if(s)h+="<br>• "+esc(s.name)+" <span style=color:var(--text2)>("+esc(p.why||"")+")</span>"});addMsg("ai",h)}catch(e){addMsg("ai","失败："+e.message)}}
function addMsg(c,t){const ch=document.getElementById("aipc");const d=document.createElement("div");d.className="msg "+c;d.innerHTML=t;ch.appendChild(d);ch.scrollTop=ch.scrollHeight}
document.getElementById("imp").addEventListener("click",()=>document.getElementById("finput").click());
document.getElementById("finput").addEventListener("change",e=>importFiles(e.target.files));
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase();st.filtered=st.songs.filter(s=>(s.name+" "+s.album+" "+s.artist).toLowerCase().includes(q));if(st.view==="songs")rs()});
document.getElementById("content").addEventListener("click",e=>{const r=e.target.closest(".row");if(r){playIdx(+r.dataset.i);return}const a=e.target.closest(".card[data-a]");if(a){const ss=st.songs.filter(s=>(s.album||"未知专辑")===a.dataset.a);st.filtered=ss;if(ss.length)playIdx(0);return}const p=e.target.closest(".card[data-p]");if(p){const ss=st.songs.filter(s=>(s.artist||"未知歌手")===p.dataset.p);st.filtered=ss;if(ss.length)playIdx(0)}});
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");st.view=b.dataset.v;if(st.view!=="aipick"&&st.view!=="settings"){document.getElementById("aipm").classList.remove("show");document.getElementById("setm").classList.remove("show")}render()}));
document.getElementById("play").addEventListener("click",tog);
document.getElementById("next").addEventListener("click",nx);
document.getElementById("prev").addEventListener("click",pv);
document.getElementById("trk").addEventListener("click",e=>{const r=e.currentTarget.getBoundingClientRect();const p=(e.clientX-r.left)/r.width;if(audio.duration)audio.currentTime=p*audio.duration});
document.getElementById("fs-open").addEventListener("click",()=>document.getElementById("fs").classList.add("show"));
document.getElementById("fs-close").addEventListener("click",()=>document.getElementById("fs").classList.remove("show"));
document.getElementById("setc").addEventListener("click",()=>document.getElementById("setm").classList.remove("show"));
document.getElementById("sets").addEventListener("click",()=>{st.key=document.getElementById("key").value.trim();localStorage.setItem("echoWebKey",st.key);document.getElementById("setm").classList.remove("show");toast("API Key 已保存")});
