name: Build macOS + Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci || npm install
      - name: Build macOS (unpacked)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --universal --dir
      - name: Ad-hoc codesign (fix malware false positive)
        run: |
          find app/dist -name '*.app' -maxdepth 5 | while read app; do
            codesign --force --deep --sign - "$app" || echo "codesign skipped: $app"
          done
      - name: Repackage dmg + zip
        working-directory: app
        run: |
          APP_PATH=$(find dist -name '*.app' -maxdepth 6 | head -1)
          echo "APP: $APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" dist/echo-music-mac-universal.zip
          hdiutil create -volname 'Echo Music' -srcfolder "$APP_PATH" -ov -format UDZO dist/Echo-Music-0.2.2-mac-universal.dmg
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-music-mac
          path: |
            app/dist/*.dmg
            app/dist/*.zip
      - name: Publish to GitHub Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.2.2 dist/echo-music-mac-universal.zip --clobber || true
          gh release upload v0.2.2 dist/Echo-Music-0.2.2-mac-universal.dmg --clobber || true
      - name: Push dmg to repo downloads (fast CDN via Pages)
        run: |
          cp app/dist/Echo-Music-0.2.2-mac-universal.dmg downloads/Echo-Music-0.2.2-mac-universal.dmg
          git config user.name "yxy073795"
          git config user.email "yxy073795@users.noreply.github.com"
          git add -f downloads/Echo-Music-0.2.2-mac-universal.dmg
          git commit -m "update mac universal dmg" || echo "no changes"
          git push origin main || echo "push skipped"
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci || npm install
      - name: Build Windows (nsis + portable)
        working-directory: app
        run: npx electron-builder --win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-music-win
          path: |
            app/dist/*.exe
