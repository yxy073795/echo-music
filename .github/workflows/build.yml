name: Build macOS + Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci || npm install
      - name: Build macOS arm64 (unpacked)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --dir
      - name: Ad-hoc codesign arm64
        run: |
          find app/dist -name '*.app' -maxdepth 5 | while read app; do
            codesign --force --deep --sign - "$app" || echo "codesign skipped: $app"
          done
      - name: Repackage arm64 dmg
        working-directory: app
        run: |
          APP_ARM=$(find dist -name '*.app' -maxdepth 6 | head -1)
          hdiutil create -volname 'Echo Music' -srcfolder "$APP_ARM" -ov -format UDZO dist/Echo-Music-0.2.2-mac-arm64.dmg
          ditto -c -k --keepParent "$APP_ARM" dist/echo-music-mac-arm64.zip
      - name: Build macOS x64 (unpacked)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --x64 --dir
      - name: Ad-hoc codesign x64
        run: |
          find app/dist -name '*.app' -maxdepth 5 | while read app; do
            codesign --force --deep --sign - "$app" || echo "codesign skipped: $app"
          done
      - name: Repackage x64 dmg
        working-directory: app
        run: |
          APP_X64=$(find dist -name '*.app' -maxdepth 6 | head -1)
          hdiutil create -volname 'Echo Music' -srcfolder "$APP_X64" -ov -format UDZO dist/Echo-Music-0.2.2-mac-x64.dmg
          ditto -c -k --keepParent "$APP_X64" dist/echo-music-mac-x64.zip
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-music-mac
          path: |
            app/dist/*.dmg
            app/dist/*.zip
      - name: Push dmgs to repo downloads (fast CDN via Pages)
        run: |
          cp app/dist/Echo-Music-0.2.2-mac-arm64.dmg downloads/Echo-Music-0.2.2-mac-arm64.dmg
          cp app/dist/Echo-Music-0.2.2-mac-x64.dmg downloads/Echo-Music-0.2.2-mac-x64.dmg
          git config user.name "yxy073795"
          git config user.email "yxy073795@users.noreply.github.com"
          git add -f downloads/Echo-Music-0.2.2-mac-arm64.dmg downloads/Echo-Music-0.2.2-mac-x64.dmg
          git -c
